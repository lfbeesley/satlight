[project]
name = "satlight"
version = "0.1.0a3"
authors = [
  { name = "L Beesley", email = "l.beesley@bham.ac.uk" },
]
description = "A package to produce high fidelity RSO lightcurves"
requires-python = ">=3.11,<3.12"
readme = "README.md"

license = "GPL-3.0-or-later" #Same as blender
license-files = ["LICENSE"]
keywords = ["satellite", "lightcurve", "photometry", "BRDF", "ray tracing",
            "space situational awareness", "dark and quiet skies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy",
  "astropy",
  "skyfield",
  "sgp4",
  "bpy==4.5.3",
  "mathutils==3.3.0",
  "hide_warnings",
  "plotly",
]

[project.urls]
Homepage = "https://github.com/lfbeesley/satlight"
Source = "https://github.com/lfbeesley/satlight"
Issues = "https://github.com/lfbeesley/satlight/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

packages = ["satlight"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "-m 'not needs_ephemeris and not needs_bpy and not slow'"
markers = [
  "slow: takes seconds or more",
  "needs_bpy: requires Blender",
  "needs_ephemeris: requires skyfield and a JPL ephemeris",
]
