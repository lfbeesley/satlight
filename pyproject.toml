[project]
name = "satlight"
version = "0.1.0a3"
authors = [
  { name = "L Beesley", email = "l.beesley@bham.ac.uk" },
]
description = "A package to produce high fidelity RSO lightcurves"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
  "numpy",
  "matplotlib",
  "astropy",
  "skyfield",
  "sgp4",
  "trimesh",
  "tqdm",
  "plotly",
  "xarray",
  "netCDF4",
  "bpy==4.5.3",
  "mathutils==3.3.0",
  "hide_warnings",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["satlight*"]

[tool.setuptools.package-data]
satlight = [
  "data/ceres_albedo_monthly.npy",
]
# data/ler555nm/*.dat (14 files, 2.8 MB) is kept in the repo but
# not shipped: nothing in the package reads it yet. Adding it back here when the
# GOME/LER earthshine path has been implemented.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is the fast offline tier. The heavier tiers are opt-in:
#   pytest -m needs_ephemeris      skyfield + de421.bsp (downloads on first use)
#   pytest -m "slow or needs_bpy"  Blender renders
#   pytest -m ""                   everything
addopts = "-m 'not needs_ephemeris and not needs_bpy and not slow'"
markers = [
  "slow: takes seconds or more",
  "needs_bpy: requires Blender",
  "needs_ephemeris: requires skyfield and a JPL ephemeris",
]
